<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वर्चुअल स्मार्ट बल्ब लैब</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Display Section (~28% height, Right side bulb, Left side illumination) */
        .top-display {
            height: 28vh;
            background-color: #000;
            display: flex;
            position: relative;
            border-bottom: 2px solid #222;
        }
        .illumination-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0) 70%);
            transition: background 0.3s ease, transform 0.3s ease;
            opacity: 0;
        }
        .bulb-area {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-right: 20px;
            flex-wrap: wrap;
        }
        .virtual-bulb {
            width: 70px;
            height: 85px;
            background: #222;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bulb-glass {
            width: 60px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bulb-base {
            position: absolute;
            bottom: -8px;
            width: 28px;
            height: 12px;
            background: #555;
            border-radius: 2px;
        }
        
        /* Bottom Control Panel Section (~72% height, scrollable, dark theme) */
        .bottom-panel {
            height: 72vh;
            background-color: #121212;
            overflow-y: auto;
            padding: 15px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #0066cc;
            border-color: #3399ff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ccc;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .control-group {
            margin-bottom: 12px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #0066cc;
        }
        .btn {
            padding: 8px 14px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px 4px 4px 0;
            font-size: 0.9rem;
        }
        .btn:hover { background: #444; }
        .btn-primary { background: #0066cc; border-color: #3399ff; }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        .slot-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        select {
            flex: 1;
            padding: 6px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }

        /* Full-Screen Immersive Light Mode */
        #fullscreenBtn {
            font-size: 0.8rem;
            padding: 8px 10px;
        }
        .immersive-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            transition: background-color 0.3s ease;
            z-index: 2000;
            display: none;
        }
        .immersive-overlay.active {
            display: block;
        }
        .immersive-back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .immersive-back-btn:hover {
            background: rgba(0, 0, 0, 0.75);
        }
    </style>
</head>
<body>
    <!-- Top Display Area (Right side bulb, Left side illumination, ~28% height) -->
    <div class="top-display" role="region" aria-label="वर्चुअल बल्ब और रोशनी का डिस्प्ले">
        <div class="illumination-area" aria-label="बल्ब की रोशनी का प्रभाव">
            <div id="glowEffect" class="glow-effect"></div>
        </div>
        <div class="bulb-area">
            <div class="virtual-bulb" aria-label="वर्चुअल स्मार्ट बल्ब">
                <div id="bulbGlass" class="bulb-glass"></div>
                <div class="bulb-base"></div>
            </div>
            <button id="masterSwitch" class="btn" aria-label="मास्टर स्विच चालू या बंद करें" onclick="togglePower()">बंद (OFF)</button>
            <button id="fullscreenBtn" class="btn" aria-label="फुल स्क्रीन लाइट मोड शुरू करें" onclick="enterImmersiveMode()">⛶ फुल स्क्रीन लाइट</button>
        </div>
    </div>

    <!-- Bottom Scrollable Control Panel (~72% height) -->
    <div class="bottom-panel" role="region" aria-label="कंट्रोल पैनल और लैब सेटिंग्स">
        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="normalTab" onclick="switchTab('normal')">नॉर्मल मोड</button>
            <button class="tab-btn" role="tab" aria-selected="false" aria-controls="labTab" onclick="switchTab('lab')">साइंस लैब मोड</button>
        </div>

        <!-- Normal Tab -->
        <div id="normalTab" class="tab-content active" role="tabpanel">
            <div class="section-title">प्रीसेट कलर्स (डिफ़ॉल्ट रंग)</div>
            <div class="color-grid" id="presetColorsContainer"></div>
            <div class="control-group">
                <label for="normalBrightness">मास्टर ब्राइटनेस: <span id="normalBrightnessVal">100</span>%</label>
                <input type="range" id="normalBrightness" min="5" max="100" value="100" aria-label="मास्टर ब्राइटनेस स्तर" oninput="updateNormalBrightness()">
            </div>
        </div>

        <!-- Science Lab Tab -->
        <div id="labTab" class="tab-content" role="tabpanel">
            <div class="section-title">मैन्युअल चैनल कंट्रोल (R, G, B, CW, WW)</div>
            <div class="control-group">
                <label for="redSlider">लाल (Red): <span id="redVal">0</span>%</label>
                <input type="range" id="redSlider" min="0" max="100" value="0" aria-label="लाल रंग की तीव्रता" oninput="updateLabChannels()">
            </div>
            <div class="control-group">
                <label for="greenSlider">हरा (Green): <span id="greenVal">0</span>%</label>
                <input type="range" id="greenSlider" min="0" max="100" value="0" aria-label="हरा रंग की तीव्रता" oninput="updateLabChannels()">
            </div>
            <div class="control-group">
                <label for="blueSlider">नीला (Blue): <span id="blueVal">0</span>%</label>
                <input type="range" id="blueSlider" min="0" max="100" value="0" aria-label="नीला रंग की तीव्रता" oninput="updateLabChannels()">
            </div>
            <div class="control-group">
                <label for="cwSlider">कूल व्हाइट (Cool White): <span id="cwVal">0</span>%</label>
                <input type="range" id="cwSlider" min="0" max="100" value="0" aria-label="कूल व्हाइट प्रकाश तीव्रता" oninput="updateLabChannels()">
            </div>
            <div class="control-group">
                <label for="wwSlider">वॉर्म व्हाइट (Warm White): <span id="wwVal">0</span>%</label>
                <input type="range" id="wwSlider" min="0" max="100" value="0" aria-label="वॉर्म व्हाइट प्रकाश तीव्रता" oninput="updateLabChannels()">
            </div>

            <button class="btn btn-primary" aria-label="वर्तमान कलर सेव करें" onclick="saveCurrentColor()">कलर सेव करें (Save Color)</button>

            <div class="section-title" style="margin-top: 20px;">सेव किए गए कलर्स (ऑन/ऑफ करके मिक्स करें)</div>
            <div class="color-grid" id="savedColorsContainer">
                <p style="font-size: 0.85rem; color: #888;">अभी कोई कलर सेव नहीं किया गया है।</p>
            </div>

            <div class="section-title" style="margin-top: 20px;">कस्टम पैटर्न बिल्डर (10 खांचा)</div>
            <div id="patternSlotsContainer"></div>

            <div class="control-group" style="margin-top: 15px;">
                <label for="transitionType">ट्रांजिशन मोड:</label>
                <select id="transitionType" aria-label="पैटर्न ट्रांजिशन मोड चुनें">
                    <option value="instant">झटके से (Instant Jump)</option>
                    <option value="smooth">धीरे-धीरे (Smooth Fade)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="patternSpeed">पैटर्न स्पीड: <span id="speedVal">50</span>%</label>
                <input type="range" id="patternSpeed" min="5" max="100" step="5" value="50" aria-label="पैटर्न बदलने की स्पीड" oninput="updateSpeedVal()">
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;" aria-label="पैटर्न लागू करें और शुरू करें" onclick="applyPattern()">पैटर्न लागू करें (Apply Pattern)</button>
            <button class="btn" style="width: 100%; margin-top: 5px;" aria-label="पैटर्न बंद करें" onclick="stopPattern()">पैटर्न बंद करें</button>
        </div>
    </div>

    <!-- Full-Screen Immersive Light Overlay -->
    <div id="immersiveOverlay" class="immersive-overlay" aria-label="फुल स्क्रीन लाइट मोड">
        <button class="immersive-back-btn" aria-label="फुल स्क्रीन लाइट मोड से वापस जाएं" onclick="exitImmersiveMode()">वापस (Back)</button>
    </div>

    <script>
        let isPowerOn = false;
        let currentTab = 'normal';
        let savedColors = [];
        let activeColor = { r: 0, g: 0, b: 0, cw: 0, ww: 0 };
        let manualColor = { r: 0, g: 0, b: 0, cw: 0, ww: 0 }; // लैब स्लाइडर्स की वैल्यू
        let activeToggleKeys = new Set(); // लैब में ऑन किए गए सेव्ड कलर्स
        let normalBrightness = 100;
        let patternInterval = null;
        let currentSlotIndex = 0;
        let immersiveMode = false;
        let audioCtx = null;

        const presetColors = [
            { name: "डेलाइट व्हाइट", r: 255, g: 255, b: 255, cw: 100, ww: 50 },
            { name: "वॉर्म येलो", r: 255, g: 200, b: 50, cw: 0, ww: 100 },
            { name: "ओशन ब्लू", r: 0, g: 100, b: 255, cw: 20, ww: 0 },
            { name: "तोतिया हरा", r: 50, g: 255, b: 100, cw: 10, ww: 0 },
            { name: "डार्क पिंक", r: 255, g: 20, b: 147, cw: 10, ww: 0 },
            { name: "आसमानी (Sky)", r: 100, g: 200, b: 255, cw: 30, ww: 0 },
            { name: "सायान", r: 0, g: 255, b: 255, cw: 20, ww: 0 },
            { name: "लैवेंडर", r: 180, g: 100, b: 255, cw: 10, ww: 0 },
            { name: "पीच", r: 255, g: 150, b: 100, cw: 0, ww: 80 },
            { name: "डीप पर्पल", r: 128, g: 0, b: 128, cw: 0, ww: 0 }
        ];

        function initApp() {
            renderPresetColors();
            renderPatternSlots();
            updateBulbDisplay();
        }

        /* ===== वर्चुअल ऑन/ऑफ साउंड (सिर्फ कोड से जनरेट, कोई फाइल नहीं) ===== */
        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playToggleSound(turningOn) {
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                const now = ctx.currentTime;
                if (turningOn) {
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(720, now + 0.12);
                } else {
                    osc.frequency.setValueAtTime(720, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.12);
                }
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.2);
            } catch (e) {
                // ऑडियो उपलब्ध नहीं है तो चुपचाप अनदेखा करें
            }
        }

        function togglePower() {
            isPowerOn = !isPowerOn;
            playToggleSound(isPowerOn);
            const btn = document.getElementById('masterSwitch');
            if (isPowerOn) {
                btn.textContent = "चालू (ON)";
                btn.classList.add('btn-primary');
            } else {
                btn.textContent = "बंद (OFF)";
                btn.classList.remove('btn-primary');
            }
            updateBulbDisplay();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tabName === 'normal') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.querySelector('.tab-btn:nth-child(1)').setAttribute('aria-selected', 'true');
                document.getElementById('normalTab').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').setAttribute('aria-selected', 'true');
                document.getElementById('labTab').classList.add('active');
            }
            // सिर्फ टैब बदलने से पैटर्न या मिक्स नहीं रुकता — जैसा जल रहा है वैसा जलता रहेगा
        }

        function renderPresetColors() {
            const container = document.getElementById('presetColorsContainer');
            container.innerHTML = '';
            presetColors.forEach((color, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = color.name;
                btn.setAttribute('aria-label', `${color.name} रंग चुनें`);
                btn.onclick = () => {
                    if (!isPowerOn) togglePower();
                    // नॉर्मल मोड में कोई रंग चुनते ही पैटर्न और लैब के सारे एक्टिव इफेक्ट बंद हो जाएं
                    stopPattern();
                    resetLabState();
                    activeColor = { r: color.r, g: color.g, b: color.b, cw: color.cw, ww: color.ww };
                    updateBulbDisplay();
                };
                container.appendChild(btn);
            });
        }

        function updateNormalBrightness() {
            normalBrightness = parseInt(document.getElementById('normalBrightness').value);
            document.getElementById('normalBrightnessVal').textContent = normalBrightness;
            if (isPowerOn) updateBulbDisplay();
        }

        /* लैब स्लाइडर्स को अपडेट करना — यह हमेशा सेव्ड कलर टॉगल्स के साथ मिक्स होकर चलेगा */
        function updateLabChannels() {
            const r = parseInt(document.getElementById('redSlider').value);
            const g = parseInt(document.getElementById('greenSlider').value);
            const b = parseInt(document.getElementById('blueSlider').value);
            const cw = parseInt(document.getElementById('cwSlider').value);
            const ww = parseInt(document.getElementById('wwSlider').value);

            document.getElementById('redVal').textContent = r;
            document.getElementById('greenVal').textContent = g;
            document.getElementById('blueVal').textContent = b;
            document.getElementById('cwVal').textContent = cw;
            document.getElementById('wwVal').textContent = ww;

            manualColor = { r, g, b, cw, ww };
            stopPattern();
            recomputeLabMix();
        }

        /* सभी एक्टिव सोर्स (स्लाइडर + ऑन किए गए सेव्ड कलर) को जोड़कर फाइनल मिक्स बनाना */
        function recomputeLabMix() {
            let mix = { r: manualColor.r, g: manualColor.g, b: manualColor.b, cw: manualColor.cw, ww: manualColor.ww };
            activeToggleKeys.forEach(key => {
                const parts = key.split('_');
                const type = parts[0];
                const idx = parseInt(parts[1]);
                const col = type === 'saved' ? savedColors[idx] : null;
                if (col) {
                    mix.r += col.r;
                    mix.g += col.g;
                    mix.b += col.b;
                    mix.cw += col.cw;
                    mix.ww += col.ww;
                }
            });
            activeColor = mix;
            if (isPowerOn) updateBulbDisplay();
        }

        /* लैब मोड के सारे मैनुअल कंट्रोल और टॉगल किए हुए कलर रीसेट करना */
        function resetLabState() {
            manualColor = { r: 0, g: 0, b: 0, cw: 0, ww: 0 };
            activeToggleKeys.clear();
            ['redSlider', 'greenSlider', 'blueSlider', 'cwSlider', 'wwSlider'].forEach(id => {
                document.getElementById(id).value = 0;
            });
            document.getElementById('redVal').textContent = 0;
            document.getElementById('greenVal').textContent = 0;
            document.getElementById('blueVal').textContent = 0;
            document.getElementById('cwVal').textContent = 0;
            document.getElementById('wwVal').textContent = 0;
            renderSavedColors();
        }

        function saveCurrentColor() {
            const colorCopy = { ...activeColor, name: `कस्टम कलर ${savedColors.length + 1}` };
            savedColors.push(colorCopy);
            renderSavedColors();
            renderPatternSlots();
        }

        /* सेव किए गए कलर अब ऑन/ऑफ टॉगल बटन हैं — कई कलर एक साथ ऑन करके मिक्स कर सकते हैं */
        function renderSavedColors() {
            const container = document.getElementById('savedColorsContainer');
            if (savedColors.length === 0) {
                container.innerHTML = '<p style="font-size: 0.85rem; color: #888;">अभी कोई कलर सेव नहीं किया गया है।</p>';
                return;
            }
            container.innerHTML = '';
            savedColors.forEach((color, idx) => {
                const key = `saved_${idx}`;
                const isActive = activeToggleKeys.has(key);
                const btn = document.createElement('button');
                btn.className = 'btn' + (isActive ? ' btn-primary' : '');
                btn.textContent = color.name + (isActive ? ' ✓ ON' : ' (OFF)');
                btn.setAttribute('aria-label', `सेव किया गया ${color.name} रंग ऑन या ऑफ करें`);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                btn.onclick = () => {
                    if (!isPowerOn) togglePower();
                    stopPattern();
                    if (activeToggleKeys.has(key)) {
                        activeToggleKeys.delete(key);
                    } else {
                        activeToggleKeys.add(key);
                    }
                    renderSavedColors();
                    recomputeLabMix();
                };
                container.appendChild(btn);
            });
        }

        function renderPatternSlots() {
            const container = document.getElementById('patternSlotsContainer');

            // पहले से चुने गए खांचों (slots) की वैल्यू सुरक्षित रखें,
            // ताकि नया कलर सेव करने पर पैटर्न सेटिंग रीसेट न हो
            const previousSelections = [];
            for (let i = 0; i < 10; i++) {
                const existingSelect = document.getElementById(`slot_${i}`);
                previousSelections.push(existingSelect ? existingSelect.value : "");
            }

            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const row = document.createElement('div');
                row.className = 'slot-row';
                
                const label = document.createElement('span');
                label.style.fontSize = '0.85rem';
                label.style.width = '60px';
                label.textContent = `खांचा ${i + 1}:`;

                const select = document.createElement('select');
                select.id = `slot_${i}`;
                select.setAttribute('aria-label', `पैटर्न खांचा ${i + 1} के लिए रंग चुनें`);
                
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.textContent = "-- खाली रखें --";
                select.appendChild(defaultOpt);

                presetColors.forEach((p, pIdx) => {
                    let opt = document.createElement('option');
                    opt.value = `preset_${pIdx}`;
                    opt.textContent = p.name;
                    select.appendChild(opt);
                });

                savedColors.forEach((s, sIdx) => {
                    let opt = document.createElement('option');
                    opt.value = `saved_${sIdx}`;
                    opt.textContent = s.name;
                    select.appendChild(opt);
                });

                // पिछली चुनी हुई वैल्यू वापस लागू करें (अगर वो अब भी मौजूद है)
                if (previousSelections[i]) {
                    select.value = previousSelections[i];
                }

                row.appendChild(label);
                row.appendChild(select);
                container.appendChild(row);
            }
        }

        function updateSpeedVal() {
            const val = document.getElementById('patternSpeed').value;
            document.getElementById('speedVal').textContent = val;
            if (patternInterval) {
                applyPattern();
            }
        }

        function applyPattern() {
            stopPattern();
            let selectedColors = [];
            for (let i = 0; i < 10; i++) {
                const sel = document.getElementById(`slot_${i}`).value;
                if (sel !== "") {
                    let parts = sel.split('_');
                    let type = parts[0];
                    let idx = parseInt(parts[1]);
                    if (type === 'preset') selectedColors.push(presetColors[idx]);
                    if (type === 'saved') selectedColors.push(savedColors[idx]);
                }
            }

            if (selectedColors.length === 0) {
                alert("कृपया पैटर्न के लिए कम से कम एक खांचे में रंग चुनें!");
                return;
            }

            if (!isPowerOn) togglePower();

            const speed = parseInt(document.getElementById('patternSpeed').value);
            const intervalTime = Math.max(500, 5000 - ((speed - 5) / 95) * 4500);
            const transition = document.getElementById('transitionType').value;

            const bulbGlass = document.getElementById('bulbGlass');
            if (transition === 'smooth') {
                bulbGlass.style.transition = `background ${intervalTime / 1000}s ease`;
            } else {
                bulbGlass.style.transition = `none`;
            }

            currentSlotIndex = 0;
            patternInterval = setInterval(() => {
                let col = selectedColors[currentSlotIndex];
                activeColor = { r: col.r, g: col.g, b: col.b, cw: col.cw, ww: col.ww };
                updateBulbDisplay();
                currentSlotIndex = (currentSlotIndex + 1) % selectedColors.length;
            }, intervalTime);
        }

        function stopPattern() {
            if (patternInterval) {
                clearInterval(patternInterval);
                patternInterval = null;
            }
        }

        function updateBulbDisplay() {
            const bulbGlass = document.getElementById('bulbGlass');
            const glowEffect = document.getElementById('glowEffect');
            const overlay = document.getElementById('immersiveOverlay');

            if (!isPowerOn) {
                bulbGlass.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
                bulbGlass.style.boxShadow = 'none';
                glowEffect.style.opacity = '0';
                if (immersiveMode) overlay.style.backgroundColor = '#000';
                return;
            }

            let mult = currentTab === 'normal' ? (normalBrightness / 100) : 1;
            let r = Math.min(255, Math.floor((activeColor.r + activeColor.cw * 0.8 + activeColor.ww * 0.9) * mult));
            let g = Math.min(255, Math.floor((activeColor.g + activeColor.cw * 0.8 + activeColor.ww * 0.7) * mult));
            let b = Math.min(255, Math.floor((activeColor.b + activeColor.cw * 1.0 + activeColor.ww * 0.3) * mult));

            let rgbColor = `rgb(${r}, ${g}, ${b})`;
            bulbGlass.style.backgroundColor = rgbColor;
            bulbGlass.style.boxShadow = `0 0 20px ${rgbColor}`;
            
            glowEffect.style.opacity = '0.85';
            glowEffect.style.background = `radial-gradient(circle, rgba(${r},${g},${b},0.75) 0%, rgba(0,0,0,0) 75%)`;

            if (immersiveMode) {
                overlay.style.backgroundColor = rgbColor;
            }
        }

        /* ===== फुल स्क्रीन इमर्सिव लाइट मोड ===== */
        function enterImmersiveMode() {
            immersiveMode = true;
            document.getElementById('immersiveOverlay').classList.add('active');

            const el = document.documentElement;
            const requestFs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (requestFs) {
                try {
                    requestFs.call(el).catch(() => { /* फुलस्क्रीन ब्लॉक हो सकता है, फिर भी ओवरले तो चलेगा */ });
                } catch (e) { /* ignore */ }
            }

            updateBulbDisplay();
        }

        function exitImmersiveMode() {
            immersiveMode = false;
            document.getElementById('immersiveOverlay').classList.remove('active');

            if (document.fullscreenElement || document.webkitFullscreenElement) {
                const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
                if (exitFs) {
                    try { exitFs.call(document); } catch (e) { /* ignore */ }
                }
            }
        }

        // अगर यूज़र Esc दबाकर या ब्राउज़र से खुद फुलस्क्रीन से बाहर आ जाए, तो भी ओवरले सिंक में रहे
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && immersiveMode) {
                exitImmersiveMode();
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement && immersiveMode) {
                exitImmersiveMode();
            }
        });

        window.onload = initApp;
    </script>
</body>
</html>
